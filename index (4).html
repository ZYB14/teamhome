<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>矿工口述史 · 数字云研学</title>
<style>
  :root {
    --ink: #111111;
    --paper: #ffffff;
    --wash: #f4f3f0;
    --orange: #EF8A2D;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "SimSun", serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }

  /* ===== 横版网格：两行 × 一行三个，铺满屏幕不溢出 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    height: 100%;
    max-width: 100%;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    padding: 12px;
    overflow: hidden;
    border: 4px solid var(--ink);
    background: var(--paper);
    text-decoration: none;
    color: var(--ink);
    transition: background-color 160ms ease, transform 160ms ease;
  }

  .cell:hover,
  .cell:focus-visible {
    background: var(--wash);
    transform: translateY(-2px);
  }

  .cell:focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: -7px;
  }

  .cell .label {
    font-size: clamp(15px, 4.2vh, 42px);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.25;
    text-align: center;
    text-indent: 0.08em;
    white-space: nowrap;
  }

  /* ===== 详情页 ===== */
  .detail {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    width: 100%;
  }

  .detail.is-active {
    display: flex;
  }

  .detail h1 {
    font-size: clamp(20px, 5vh, 52px);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-indent: 0.1em;
  }

  .detail p {
    font-size: clamp(12px, 1.9vh, 18px);
    color: #666;
    max-width: 48ch;
    line-height: 1.7;
  }

  .back-link {
    display: inline-block;
    border: 3px solid var(--ink);
    padding: 8px 24px;
    color: var(--ink);
    text-decoration: none;
    font-size: clamp(12px, 1.8vh, 16px);
    font-weight: 600;
    letter-spacing: 0.06em;
    transition: background-color 160ms ease, color 160ms ease;
  }

  .back-link:hover,
  .back-link:focus-visible {
    background: var(--ink);
    color: var(--paper);
  }

  /* ===== 竖屏提示：手机请横过来看 ===== */
  .rotate-tip {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 24px;
    width: 100%;
    height: 100%;
  }

  .rotate-tip svg {
    width: 64px;
    height: 64px;
    stroke: var(--ink);
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .rotate-tip p {
    font-size: 18px;
    font-weight: 600;
  }

  @media (orientation: portrait) and (max-width: 768px) {
    .grid,
    .detail {
      display: none !important;
    }
    .rotate-tip {
      display: flex;
    }
  }

  /* ===== 横屏窄高度适配 ===== */
  @media (orientation: landscape) and (max-height: 500px) {
    body {
      padding: 10px;
    }
    .grid {
      gap: 10px;
    }
    .cell {
      border-width: 3px;
      padding: 8px;
    }
  }
</style>
</head>
<body>

  <!-- 首页视图 -->
  <section class="grid" id="home" aria-label="栏目导航首页"></section>

  <!-- 详情视图 -->
  <section class="detail" id="detail" aria-label="栏目详情页">
    <h1 id="detail-title"></h1>
    <p id="detail-desc"></p>
    <a class="back-link" href="#home">返回首页</a>
  </section>

  <!-- 竖屏旋转提示 -->
  <section class="rotate-tip" aria-label="横屏提示">
    <svg viewBox="0 0 24 24">
      <rect x="7" y="3" width="10" height="18" rx="2"></rect>
      <path d="M4 8 L2 12 L4 16"></path>
      <path d="M20 8 L22 12 L20 16"></path>
    </svg>
    <p>请将手机横过来看</p>
  </section>

<script>
  var ITEMS = [
    {
      slug: 'overview',
      label: '项目概况',
      desc: '「项目概况」页面为占位内容，可替换为项目背景、发起单位与总体目标的介绍。'
    },
    {
      slug: 'oral-history',
      label: '矿工口述史',
      desc: '「矿工口述史」页面为占位内容，可替换为矿工访谈影像、口述录音与人物档案。'
    },
    {
      slug: 'curriculum',
      label: '研学体系',
      desc: '「研学体系」页面为占位内容，可替换为课程模块、学段分级与研学路线设计。'
    },
    {
      slug: 'activity',
      label: '活动纪实',
      desc: '「活动纪实」页面为占位内容，可替换为研学活动现场图集、报道与时间线。'
    },
    {
      slug: 'cloud',
      label: '数字云研学',
      desc: '「数字云研学」页面为占位内容，可替换为线上展厅、虚拟矿洞漫游与数字资源入口。'
    },
    {
      slug: 'achievements',
      label: '成果中心',
      desc: '「成果中心」页面为占位内容，可替换为研究成果、出版读物与荣誉展示。'
    }
  ];

  var homeEl = document.getElementById('home');
  var detailEl = document.getElementById('detail');
  var titleEl = document.getElementById('detail-title');
  var descEl = document.getElementById('detail-desc');

  // 渲染首页网格
  ITEMS.forEach(function (item) {
    var link = document.createElement('a');
    link.className = 'cell';
    link.href = '#page/' + item.slug;

    var label = document.createElement('span');
    label.className = 'label';
    label.textContent = item.label;
    link.appendChild(label);

    homeEl.appendChild(link);
  });

  function findItem(slug) {
    for (var i = 0; i < ITEMS.length; i++) {
      if (ITEMS[i].slug === slug) return ITEMS[i];
    }
    return null;
  }

  function route() {
    var hash = location.hash || '#home';
    var match = hash.match(/^#page\/([a-z-]+)$/);
    var item = match ? findItem(match[1]) : null;

    if (item) {
      titleEl.textContent = item.label;
      descEl.textContent = item.desc;
      document.title = item.label + ' · 数字云研学';
      homeEl.style.display = 'none';
      detailEl.classList.add('is-active');
    } else {
      homeEl.style.display = 'grid';
      detailEl.classList.remove('is-active');
      document.title = '矿工口述史 · 数字云研学';
    }
  }

  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
